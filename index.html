<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Personnages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gestion des Personnages</h1>
        <nav class = "d-flex ">
            <input type="text" id="search" placeholder="Rechercher un personnage...">
            <button class="btn btn-dark"> Ajouter une personnage</button>
        </nav>
        
    </header>
    
    <main>
        <section id="character-detail" class="character-detail">
            <h2>Détails du personnage</h2>
            <p>Sélectionnez un personnage pour voir les détails.</p>
            
        </section>
        <section id="character-list" class="character-container">
        </section>
        
    </main>
    
    <script type="module" src="./js/config.js"></script>
    <script type="module" src="./js/provider.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
